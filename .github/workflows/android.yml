# Автосборка Android-приложения: после каждого изменения в main собирается APK
# и выкладывается во вкладку Releases. Ссылка на последнюю версию:
# https://github.com/<владелец>/planner/releases/latest/download/planner.apk
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Проверка логики
        run: node --test tests/logic.test.mjs

      # Без запуска установочных скриптов пакетов. Точные версии всех пакетов
      # фиксируются в package-lock.json: при первой сборке он создаётся и сохраняется в репозиторий,
      # дальше ставится строго то же самое (npm ci).
      - name: Установка Capacitor
        id: deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
            echo "newlock=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Сохранение package-lock.json
        if: steps.deps.outputs.newlock == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Фиксация точных версий пакетов (package-lock.json)"
          git push

      - name: Версия
        id: ver
        run: echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"

      - name: Сборка Android-проекта
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node scripts/build-www.mjs
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Сборка APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Подпись APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Нет секрета KEYSTORE_B64 — ключ подписи не настроен"; exit 1; fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_B64" | base64 -d > planner.jks
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks planner.jks --ks-key-alias planner \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out planner.apk aligned.apk
          "$BT/apksigner" verify --print-certs planner.apk
          rm planner.jks

      - name: Публикация в Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: Планировщик ${{ steps.ver.outputs.version }}
          body: |
            Скачайте planner.apk на телефон и откройте его, чтобы установить или обновить приложение.
            Записи при обновлении сохраняются.
          files: planner.apk
          make_latest: true
